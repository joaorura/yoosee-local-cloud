name: Bug Report
description: File a bug report for Yoosee Local Cloud
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe the problem clearly.
  - type: input
    id: camera_model
    attributes:
      label: Camera Model / SoC / Firmware Version
      description: e.g., Anyka AK3918 / Firmware 46.0.53
      placeholder: Anyka AK3918 / Firmware 46.0.53
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Terminal Output
      description: Paste relevant logs here.
      render: shell
