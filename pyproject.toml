[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yoosee-local-cloud"
version = "0.1.0"
description = "Local cloud mock, PTZ controller and on-demand bridge for Yoosee / Gwelltimes IP cameras (Anyka AK3918)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Joao Rura" }
]
keywords = ["yoosee", "gwelltimes", "anyka", "ip-camera", "home-assistant", "rtsp", "ptz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
]

[project.scripts]
yoosee-fake-cloud = "yoosee_local.cli:main"
yoosee-ptz = "yoosee_local.ptz:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=yoosee_local"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py310"]
